[project]
name = "agentic-media-perf"
version = "0.1.0"
description = "An agentic framework for analyzing Instagram influencer post performance using Gemini AI and deep learning."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
   "torch>=2.6.0",
   "gcsfs>=2026.2.0",
   "google-adk>=1.28.1",
   "google-cloud-storage>=3.9.0",
   "google-genai>=1.63.0",
   "grpcio>=1.79.0",
   "grpcio-status>=1.79.0",
   "lightgbm>=4.6.0",
   "matplotlib>=3.10.8",
   "pandas>=3.0.0",
   "pillow>=12.1.1",
   "python-dotenv>=1.2.2",
   "pytorch-lightning>=2.6.1",
   "scikit-learn>=1.8.0",
   "seaborn>=0.13.2",
   "sentence-transformers>=5.4.0",
   "tqdm>=4.67.3",
   "transformers>=5.5.2",
   "vertexai>=1.43.0",
   "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
   "ipykernel>=7.2.0",
]

[project.scripts]
fix-libomp = "scripts.fix_libomp:fix_libomp"

[tool.hatch.build.targets.wheel]
packages = ["src", "scripts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
